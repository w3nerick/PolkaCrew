<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolkaCrew Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#311040,#08030d 55%);color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{letter-spacing:-2px}.head h1 span{color:#ff3cad}.pill{font-size:11px;border:1px solid #4d2b58;border-radius:99px;padding:9px 12px;color:#cdb6d5}.layout{display:grid;grid-template-columns:210px 1fr;gap:14px}.panel{background:#15091d;border:1px solid #3c2046;border-radius:20px;padding:16px}.role{font-size:27px;font-weight:900;color:#6ef08b}.role.bad{color:#ff426f}.muted{color:#a88fb2;font-size:12px;line-height:1.5}canvas{width:100%;height:auto;border:1px solid #572462;border-radius:20px;display:block;background:#09040e}.buttons{display:grid;gap:10px;margin-top:15px}button{border:1px solid #61306c;background:#21102b;color:white;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.3}.pink{background:#51113d}.red{background:#42111d}.modal{position:fixed;inset:0;background:#050208dc;display:none;place-items:center;padding:20px}.card{width:min(620px,95vw);background:#190b21;border:1px solid #6f2f77;border-radius:22px;padding:24px}.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}.win{font-size:42px;font-weight:900}.stats{display:grid;gap:10px;margin-top:15px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #32163b;padding-bottom:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.head{align-items:flex-start}.pill{font-size:9px}}
</style></head><body><div class="wrap"><div class="head"><h1>POLKA<span>CREW</span></h1><div class="pill">STANDALONE MVP · NO INSTALL</div></div><div class="layout"><aside class="panel"><div class="muted">YOUR SECRET ROLE</div><div id="role" class="role">CREW</div><p id="mission" class="muted"></p><div class="stats"><div class="stat"><span class="muted">Tasks</span><b id="taskstat">0/4</b></div><div class="stat"><span class="muted">Alive</span><b id="alive">8</b></div></div><div class="buttons"><button id="task" class="pink">⚡ Complete nearby task</button><button id="kill" class="red">✦ Disable nearby crew</button><button id="meet">◉ Emergency meeting</button></div><p class="muted">Move with WASD or arrow keys. Pink beacons are platform tasks.</p></aside><main><canvas id="game" width="900" height="560"></canvas></main></div></div><div id="modal" class="modal"><div class="card"><div class="muted">EMERGENCY CONSENSUS</div><h2 id="modalTitle">Vote</h2><div id="votes" class="vote"></div><button id="close" style="display:none">New match</button></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),keys=new Set(),W=c.width,H=c.height;addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const colors=['#ff267d','#8c5cff','#36e4da','#ffd166','#6ef08b','#ff7b54','#4ea1ff','#f4f1ff'],names=['erick.dot','Nova','Byte','Orbit','Pixel','Relay','Zero','Kappa'];let sab=Math.floor(Math.random()*8),ended=false,winner='';
const players=names.map((n,i)=>({id:i,name:n,color:colors[i],role:i===sab?'saboteur':'crew',alive:true,x:430+Math.cos(i)*120,y:280+Math.sin(i)*120,tasks:0,local:i===0}));const me=players[0];
const tasks=[['Stabilize Relay',130,120],['Sync Bulletin',760,120],['Route Asset Hub',730,435],['Verify Identity',160,435]].map((a,i)=>({id:i,label:a[0],x:a[1],y:a[2],done:false}));
role.textContent=me.role==='crew'?'CREW':'SABOTEUR';role.className='role'+(me.role==='saboteur'?' bad':'');mission.textContent=me.role==='crew'?'Complete every platform task and expose the saboteur.':'Blend in, get close, and disable the crew.';
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearTask(){return tasks.filter(t=>!t.done).sort((a,b)=>dist(a,me)-dist(b,me))[0]}function nearVictim(){return players.filter(p=>p.alive&&!p.local&&p.role==='crew').sort((a,b)=>dist(a,me)-dist(b,me))[0]}
function status(){task.disabled=!(me.role==='crew'&&nearTask()&&dist(nearTask(),me)<70)||ended;kill.disabled=!(me.role==='saboteur'&&nearVictim()&&dist(nearVictim(),me)<75)||ended;taskstat.textContent=me.tasks+'/4';alive.textContent=players.filter(p=>p.alive).length}
task.onclick=()=>{let t=nearTask();if(t&&dist(t,me)<70){t.done=true;me.tasks++;if(me.tasks===4)end('CREW')}};kill.onclick=()=>{let p=nearVictim();if(p&&dist(p,me)<75){p.alive=false;check()}};meet.onclick=()=>openVote();close.onclick=()=>location.reload();
function check(){let crew=players.filter(p=>p.alive&&p.role==='crew').length,bad=players.filter(p=>p.alive&&p.role==='saboteur').length;if(bad===0)end('CREW');else if(crew<=bad)end('SABOTEUR')}
function openVote(){if(ended)return;modal.style.display='grid';votes.innerHTML='';players.filter(p=>p.alive).forEach(p=>{let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>{p.alive=false;modal.style.display='none';check()};votes.appendChild(b)})}
function end(w){ended=true;winner=w;modal.style.display='grid';modalTitle.innerHTML='<div class="win">'+w+' VICTORY</div><p class="muted">Match replay is ready for Bulletin integration in the Product SDK project.</p>';votes.innerHTML='';close.style.display='block'}
function rr(ctx,a,b,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(a,b,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}
function draw(){let g=x.createRadialGradient(450,250,50,450,250,600);g.addColorStop(0,'#27153e');g.addColorStop(1,'#06020a');x.fillStyle=g;x.fillRect(0,0,W,H);rr(x,22,22,W-44,H-44,28,'#12091d','#4b2657');x.strokeStyle='#2b1633';for(let a=70;a<W;a+=85){x.beginPath();x.moveTo(a,32);x.lineTo(a,H-32);x.stroke()}for(let b=70;b<H;b+=85){x.beginPath();x.moveTo(32,b);x.lineTo(W-32,b);x.stroke()}rr(x,350,220,200,120,25,'#24102e','#c43794');x.fillStyle='#f4a5da';x.textAlign='center';x.font='700 20px system-ui';x.fillText('POLKACREW',450,286);tasks.forEach(t=>{if(t.done)return;x.shadowColor='#ff4fbc';x.shadowBlur=15;x.fillStyle='#ff4fbc';x.beginPath();x.arc(t.x,t.y,12,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#ddd';x.font='12px system-ui';x.fillText(t.label,t.x,t.y+29)});players.forEach(p=>{if(!p.alive){x.globalAlpha=.35;x.fillStyle=p.color;x.fillRect(p.x-20,p.y-5,40,10);x.globalAlpha=1;return}x.fillStyle=p.color;x.beginPath();x.roundRect(p.x-17,p.y-22,34,45,15);x.fill();x.fillStyle='#bfeeff';x.beginPath();x.roundRect(p.x+2,p.y-13,20,13,6);x.fill();x.fillStyle='#fff';x.font='600 12px system-ui';x.fillText(p.name,p.x,p.y-32)});status()}
let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;if(!ended){let dx=(keys.has('d')||keys.has('arrowright'))-(keys.has('a')||keys.has('arrowleft')),dy=(keys.has('s')||keys.has('arrowdown'))-(keys.has('w')||keys.has('arrowup'));let l=Math.hypot(dx,dy)||1;me.x=Math.max(40,Math.min(W-40,me.x+dx/l*220*dt));me.y=Math.max(45,Math.min(H-40,me.y+dy/l*220*dt));players.filter(p=>!p.local&&p.alive).forEach((p,i)=>{let s=now/900+i*1.5;p.x=Math.max(40,Math.min(W-40,p.x+Math.cos(s)*28*dt));p.y=Math.max(45,Math.min(H-40,p.y+Math.sin(s*.8)*28*dt))})}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
